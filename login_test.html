<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <title>Vetlia - Login</title>

  <style>
  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --surface2: #faf9f7;
    --primary: #2d6a4f;
    --primary-dark: #1b4332;
    --primary-light: #d8f3dc;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --border: #e5e0d8;
    --danger: #ef4444;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.14);
    --radius: 14px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── BACKGROUND DECORATIVO ── */
  .bg-deco {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-deco::before {
    content: '';
    position: absolute;
    top: -120px; right: -120px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, #d8f3dc 0%, transparent 70%);
  }

  .bg-deco::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -100px;
    width: 360px; height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, #d8f3dc 0%, transparent 70%);
  }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    position: relative;
    z-index: 1;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 380px;
    padding: 40px 36px 32px;
    animation: fadeIn 0.5s ease;
  }

  /* ── LOGO ── */
  .logo-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    animation: float 3s infinite ease-in-out;
  }

  .logo-container img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    transition: transform 0.2s;
  }

  .logo-container img:hover { transform: scale(1.15); }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--primary-dark);
    text-align: center;
    margin-bottom: 4px;
  }

  .brand-sub {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  /* ── FORM ── */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
  }

  .form-group label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
    transform: scale(1.01);
  }

  /* ── BOTÓN PRINCIPAL ── */
  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.2s;
    letter-spacing: 0.2px;
  }

  .btn-login:hover:not(:disabled) {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(27,67,50,0.25);
  }

  .btn-login:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  /* ── FORGOT ── */
  .forgot-password {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--primary);
    text-decoration: none;
    transition: color 0.2s;
  }

  .forgot-password:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  /* ── DIVIDER ── */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  /* ── EXTRA BUTTONS ── */
  .extra-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .help-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius-sm);
    background: #fff7ed;
    color: #c2410c;
    border: 1.5px solid #fed7aa;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .help-btn:hover {
    background: #c2410c;
    color: white;
    transform: translateY(-1px);
  }

  /* ── MENSAJE ── */
  .mensaje {
    margin-top: 16px;
    font-size: 0.875rem;
    font-weight: 600;
    text-align: center;
    min-height: 20px;
  }

  .success { color: var(--primary); }
  .error   { color: var(--danger); }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 14px;
    font-size: 0.75rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  /* ── ANIMACIONES ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-5px); }
  }
  </style>
</head>

<body>

<div class="bg-deco"></div>

<div class="main">
  <div class="card">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Perro">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" alt="Gato">
    </div>

    <div class="brand">Vetlia</div>
    <div class="brand-sub">Sistema de gestión veterinaria</div>

    <!-- FORM -->
    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="correo@vetlia.com">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn-login" id="btnLogin" onclick="login()">
      Iniciar sesión
    </button>

    <a href="forgot.html" class="forgot-password">
      ¿Olvidaste tu contraseña?
    </a>

    <hr class="divider">

    <div class="extra-buttons">
      <button class="help-btn" onclick="abrirAyuda()">🆘 Ayuda</button>
    </div>

    <div id="mensaje" class="mensaje"></div>

  </div>
</div>

<footer>© 2026 Vetlia 🐾 — Sistema de gestión veterinaria</footer>

<script>
async function login() {
  const email   = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const mensaje  = document.getElementById("mensaje");
  const boton    = document.getElementById("btnLogin");

  mensaje.innerHTML = "";
  boton.disabled    = true;
  boton.innerText   = "Ingresando...";

  try {
    const res  = await fetch("http://localhost/vetlia/login.php", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
      mensaje.innerHTML = "✅ Bienvenido, " + data.user.nombre;
      mensaje.className = "mensaje success";

      localStorage.setItem("user", JSON.stringify(data.user));

      setTimeout(() => {
        const rol = data.user.rol;
        console.log("ROL:", rol);

        if      (rol === "admin")       window.location.href = "dashboard.html";
        else if (rol === "veterinario") window.location.href = "veterinario.html";
        else if (rol === "paciente")    window.location.href = "paciente.html";
        else    alert("Rol no reconocido: " + rol);
      }, 800);

    } else {
      mensaje.innerHTML = "❌ " + data.error;
      mensaje.className = "mensaje error";
    }

  } catch (error) {
    mensaje.innerHTML = "❌ Error de conexión";
    mensaje.className = "mensaje error";
  }

  boton.disabled  = false;
  boton.innerText = "Iniciar sesión";
}

function abrirAyuda() {
  window.open("ayuda.html", "_blank");
}
</script>

</body>
</html>
