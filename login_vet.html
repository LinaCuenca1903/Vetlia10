<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vetlia - Login</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .main {
       display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex:1;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 340px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    /* 🐶🐱 LOGO */
    .logo-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      animation: float 3s infinite ease-in-out;
    }

    .logo-container img {
      width: 35px;
      height: 35px;
      object-fit: contain;
      transition: 0.3s;
    }

    .logo-container img:hover {
      transform: scale(1.2);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 85%;
      margin: 10px auto;
      display: block;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4facfe;
      outline: none;
      box-shadow: 0 0 8px rgba(79,172,254,0.4);
      transform: scale(1.03);
    }

    button {
      width: 70%;
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #218838;
      transform: scale(1.05);
    }

    .links {
      margin-top: 15px;
      font-size: 13px;
    }

    .links a {
      display: block;
      color: #007bff;
      text-decoration: none;
      margin: 5px 0;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .forgot-password{
      display:block;
      margin-top:12px;
      font-size:13px;
      color:#007bff;
      text-decoration:none;
      transition:.3s;
    }

    .forgot-password:hover{
      text-decoration:underline;
      color:#0056b3;
    }

    .mensaje {
      margin-top: 15px;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }

    footer {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: white;
    background: rgba(0,0,0,0.2);
    border-radius:10px;
    margin-top:20px;

    }

    .extra-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}

.help-btn,
.manual-btn{
  width:auto !important;
  padding:10px 18px;
  border:none;
  border-radius:15px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  margin-top:0;

}

.extra-buttons button{
  flex:none;
}

.help-btn{
  background:#ff9800;
  color:white;
}

.help-btn:hover{
  background:#f57c00;
  transform:translateY(-2px);
}

.manual-btn{
  background:#6c63ff;
  color:white;
}

.manual-btn:hover{
  background:#574bdb;
  transform:translateY(-2px);
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="main">
    <div class="card">

      <!-- 🐶🐱 LOGO CORRECTO -->
      <div class="logo-container">
        <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png">
        <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png">
      </div>

      <h2>Vetlia</h2>
      <p>Iniciar sesión</p>

      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">

      <button id="btnLogin" onclick="login()">Iniciar sesión</button>
      <a href="forgot.html" class="forgot-password">
        ¿Olvidaste tu contraseña?
      </a>

      <div class="links">

         </a>

  <div class="extra-buttons">

    <button class="help-btn"
            onclick="abrirAyuda()">

      🆘 Ayuda

    </button>

    

  </div>

        
     

      <div id="mensaje" class="mensaje"></div>

    </div>
  </div>

  <footer>
    © 2026 Vetlia 🐾 - Sistema de gestión veterinaria
  </footer>

  <script>
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const mensaje = document.getElementById("mensaje");
  const boton = document.getElementById("btnLogin");

  mensaje.innerHTML = "";
  boton.disabled = true;
  boton.innerText = "Ingresando...";

  try {
    const res = await fetch("http://localhost/vetlia/login.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
      mensaje.innerHTML = "✅ Bienvenido " + data.user.nombre;
      mensaje.className = "mensaje success";

      localStorage.setItem("user", JSON.stringify(data.user));

      // 🔥 REDIRECCIÓN SEGÚN ROL
      setTimeout(() => {
        const rol = data.user.rol;

        console.log("ROL:", rol); // 👈 para debug

        if (rol === "admin") {
          window.location.href = "dashboard.html";
        } 
        else if (rol === "veterinario") {
          window.location.href = "veterinario.html";
        } 
        else if (rol === "paciente") {
          window.location.href = "paciente.html";
        } 
        else {
          alert("Rol no reconocido: " + rol);
        }
      }, 800);

    } else {
      mensaje.innerHTML = "❌ " + data.error;
      mensaje.className = "mensaje error";
    }

  } catch (error) {
    mensaje.innerHTML = "❌ Error de conexión";
    mensaje.className = "mensaje error";
  }

  boton.disabled = false;
  boton.innerText = "Iniciar sesión";
}

function abrirAyuda(){
window.open(
    "ayuda.html",
    "_blank"
  );
}


</script>
</body>
</html>
